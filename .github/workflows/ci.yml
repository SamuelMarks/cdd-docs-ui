name: CI

on:
    push:
        branches: [master, main]
        tags:
            - 'v*'
    pull_request:
        branches: [master, main]

jobs:
    test-and-lint:
        runs-on: ubuntu-latest
        permissions:
            contents: write

        steps:
            - name: Checkout repository
              uses: actions/checkout@v6

            - name: Use Node.js LTS
              uses: actions/setup-node@v6
              with:
                  node-version: lts/*
                  cache: 'npm'

            - name: Install dependencies
              run: npm i

            - name: Build project
              run: npm run build

            - name: Run Tests
              run: npm run test

            - name: Update Badges
              run: node scripts/update-badges.js

            - name: Verify up-to-date README
              run: |
                  git diff --exit-code README.md || (echo "README.md badges are out of date! Please run your pre-commit hooks locally and push." && exit 1)

            - name: Upload Artifacts (Version Tag)
              if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
              uses: ncipollo/release-action@v1
              with:
                  artifacts: "dist/bundle.js,dist/cli.js"
                  allowUpdates: true
                  replacesArtifacts: true

            - name: Update latest tag
              if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
              run: |
                  git config user.name "github-actions[bot]"
                  git config user.email "github-actions[bot]@users.noreply.github.com"
                  git push origin :refs/tags/latest || true
                  git tag -d latest || true
                  git tag latest
                  git push origin refs/tags/latest
